services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: garment
      POSTGRES_PASSWORD: garment_dev_only
      POSTGRES_DB: garmentpro
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - garment_data:/var/lib/postgresql/data
volumes:
  garment_data:
